name: Build KABU Chrome web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Chrome web app
        run: npm run build
      - name: Upload web app
        uses: actions/upload-artifact@v4
        with:
          name: KABU-AI-Chrome-Web-App
          path: dist/
          if-no-files-found: error
          retention-days: 14
