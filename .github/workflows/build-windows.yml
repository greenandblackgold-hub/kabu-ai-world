name: Build KABU Chrome web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Chrome web app
        run: npm run build
      - name: Upload web app
        uses: actions/upload-artifact@v4
        with:
          name: KABU-AI-Chrome-Web-App
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Production voice end-to-end smoke test
        if: contains(github.event.head_commit.message, '[verify-kabu-voice]')
        run: |
          node --input-type=module <<'NODE'
          const base = "https://kabu-ai-world.onrender.com";
          const expectedVersion = "kabu-furry-voice-v1";
          let health;
          for (let attempt = 0; attempt < 72; attempt++) {
            try {
              const response = await fetch(base + "/api/health", { cache: "no-store" });
              const data = await response.json();
              if (response.ok && data.version === expectedVersion) {
                health = data;
                break;
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!health) throw new Error("Render did not serve the expected Kabu release within 12 minutes.");
          if (!health.configured) throw new Error("ADDIS_API_KEY is not configured on the Kabu Render service.");
          const greetingResponse = await fetch(base + "/api/greeting", { cache: "no-store" });
          const greeting = await greetingResponse.json();
          if (!greetingResponse.ok || !greeting.audio) throw new Error("Tigrinya greeting generation failed: " + (greeting.error || greetingResponse.status));
          const greetingAudioResponse = await fetch(new URL(greeting.audio, base));
          if (!greetingAudioResponse.ok || !(greetingAudioResponse.headers.get("content-type") || "").includes("audio/mpeg")) {
            throw new Error("Kabu greeting MP3 could not be played back from the app.");
          }
          const greetingAudio = Buffer.from(await greetingAudioResponse.arrayBuffer());
          if (greetingAudio.length < 1000) throw new Error("Kabu greeting MP3 was empty or incomplete.");
          const form = new FormData();
          form.append("audio", new Blob([greetingAudio], { type: "audio/mpeg" }), "kabu-greeting.mp3");
          form.append("history", "[]");
          const turnResponse = await fetch(base + "/api/voice-turn", { method: "POST", body: form });
          const turn = await turnResponse.json();
          if (!turnResponse.ok) throw new Error("Tigrinya listen/chat/reply test failed: " + (turn.error || turnResponse.status));
          if (!turn.transcript || !turn.reply || !turn.audio) throw new Error("Kabu voice turn returned incomplete transcript, reply, or audio.");
          const replyAudioResponse = await fetch(turn.audio);
          if (!replyAudioResponse.ok || !(replyAudioResponse.headers.get("content-type") || "").includes("audio/mpeg")) {
            throw new Error("Kabu spoken reply MP3 could not be retrieved.");
          }
          const replyAudio = Buffer.from(await replyAudioResponse.arrayBuffer());
          if (replyAudio.length < 1000) throw new Error("Kabu spoken reply MP3 was empty or incomplete.");
          console.log("PASS: live Render version, Tigrinya greeting audio, speech recognition, Tigrinya AI reply, and spoken reply audio.");
          NODE
